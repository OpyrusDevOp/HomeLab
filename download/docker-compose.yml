services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: ${TZ}
      WEBUI_PORT: 8081
    ports:
      - "8081:8081"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - ${ROOT_CONFIG_DIR}/qbittorrent:/config
      - ${ROOT_DATA_DIR}:/data
    networks:
      - homelab_net

networks:
  homelab_net:
    external: true
